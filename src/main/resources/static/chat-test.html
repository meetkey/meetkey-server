<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Chat WebSocket Test</title>

    <!-- SockJS & STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; }
        input, button { margin: 4px; }
        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 8px;
        }
        .msg {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<h2>🧪 Chat WebSocket Test</h2>

<div>
    <label>JWT Access Token</label><br/>
    <input id="token" type="text" size="100"
           placeholder="Bearer 없이 access token만 입력" />
</div>

<div>
    <label>Chat Room ID</label><br/>
    <input id="roomId" type="number" placeholder="예: 1" />
</div>

<div>
    <button onclick="connect()">1️⃣ Connect</button>
    <button onclick="subscribe()">2️⃣ Subscribe</button>
</div>

<hr/>

<div>
    <select id="messageType" onchange="onTypeChange()">
        <option value="TEXT">TEXT</option>
        <option value="IMAGE">IMAGE</option>
        <option value="VOICE">VOICE</option>
    </select>

    <input id="message" type="text" size="50"
           placeholder="메시지 입력" />

    <input id="duration" type="number"
           placeholder="음성 길이(ms)"
           style="display:none; width:140px;" />

    <button onclick="sendMessage()">3️⃣ Send</button>
</div>


<h3>📨 Messages</h3>
<div id="messages"></div>

<script>
    let stompClient = null;

    function onTypeChange() {
        const type = document.getElementById("messageType").value;
        const msgInput = document.getElementById("message");
        const durationInput = document.getElementById("duration");

        if (type === "TEXT") {
            msgInput.placeholder = "메시지 입력";
            durationInput.style.display = "none";
        }

        if (type === "IMAGE") {
            msgInput.placeholder = "이미지 URL 입력";
            durationInput.style.display = "none";
        }

        if (type === "VOICE") {
            msgInput.placeholder = "음성 파일 URL 입력";
            durationInput.style.display = "inline-block";
        }
    }

    function connect() {
        const socket = new SockJS("http://localhost:8080/ws-chat");
        stompClient = Stomp.over(socket);

        const token = document.getElementById("token").value;

        stompClient.connect(
            {
                Authorization: "Bearer " + token
            },
            function (frame) {
                console.log("Connected:", frame);
                alert("WebSocket 연결 성공");
            },
            function (errorFrame) {
                handleStompError(errorFrame);
            }
        );
    }

    function handleStompError(frame) {
        console.error("STOMP ERROR FRAME:", frame);

        const stompCode = frame.headers["message"]; // STOMP 에러 코드
        const httpStatus = frame.headers["mapped-http-status"]; // 매핑된 HTTP 상태
        const detailMessage = frame.body;

        appendSystemMessage(
            `ERROR [${stompCode}] (HTTP ${httpStatus}) : ${detailMessage}`
        );

        // HTTP 의미 기반 분기
        if (httpStatus === "401") {
            alert("로그인이 만료되었습니다. 다시 로그인해주세요.");
            stompClient.disconnect();
        }

        if (httpStatus === "403") {
            alert("권한이 없습니다.");
        }
    }

    function subscribe() {
        const roomId = document.getElementById("roomId").value;

        stompClient.subscribe(
            "/user/queue/chat",
            function (message) {
                const body = JSON.parse(message.body);
                appendMessage(body);
            }
        );

        alert("채팅방 구독 완료");
    }

    function sendMessage() {
        const roomId = document.getElementById("roomId").value;
        const content = document.getElementById("message").value;
        const type = document.getElementById("messageType").value;
        const duration = document.getElementById("duration").value;

        const payload = {
            chatRoomId: Number(roomId),
            messageType: type,
            content: content
        };

        if (type === "VOICE") {
            payload.duration = Number(duration);
        }

        stompClient.send(
            "/pub/chat/send",
            {},
            JSON.stringify(payload)
        );

        document.getElementById("message").value = "";
        document.getElementById("duration").value = "";
    }

    function appendMessage(msg) {
        const box = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "msg";

        console.log("받은 메시지:", msg);

        const isMine = msg.mine;

        div.style.textAlign = isMine ? "right" : "left";

        if (msg.messageType === "TEXT") {
            div.innerText =
                `[${msg.createdAt}] ${isMine ? "나" : "상대"}: ${msg.content}`;
        }

        if (msg.messageType === "IMAGE") {
            div.innerHTML = `
        [${msg.createdAt}] ${isMine ? "나" : "상대"}<br/>
        <img src="${msg.content}" style="max-width:200px"/>
        `;
        }

        if (msg.messageType === "VOICE") {
            div.innerHTML = `
        [${msg.createdAt}] ${isMine ? "나" : "상대"}
        (${msg.duration}ms)<br/>
        <audio controls src="${msg.content}"></audio>
        `;
        }

        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }


</script>

</body>
</html>
