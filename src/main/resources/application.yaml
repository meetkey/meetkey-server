spring:
  jwt:
    secret: ${JWT_SECRET_KEY}
  h2:
    console:
      enabled: true
      path: /h2-console

  application:
    name: server

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true