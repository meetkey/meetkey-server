name: cd.yml
on:
  push:
    branches: ["develop", "main"]

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Grant permission for gradlew
        run: chmod +x gradlew

      - name: Clean and Build jar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-springboot:latest -t ${{ secrets.DOCKER_USERNAME }}/docker-springboot:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-springboot:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ec2-user/app
            
            # 환경변수 설정
            export SPRING_PROFILES_ACTIVE=prod
            export S3_BUCKET=${{ secrets.S3_BUCKET }}
            export IMAGE_TAG=${{ github.sha }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export DB_URL='${{ secrets.DB_URL }}'
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PW=${{ secrets.DB_PW }}
            export DB_DRIVER='${{ secrets.DB_DRIVER }}'
            export JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}'
            export ADMIN_SECRET='${{ secrets.ADMIN_SECRET }}'
            export KAKAO_APP_KEY='${{ secrets.KAKAO_APP_KEY }}'
            
            export COOLSMS_API_KEY=${{ secrets.COOLSMS_API_KEY }}
            export COOLSMS_API_SECRET=${{ secrets.COOLSMS_API_SECRET }}
            export COOLSMS_SENDER=${{ secrets.COOLSMS_SENDER }}
            
            # Spring Boot 앱만 pull
            docker compose -f docker-compose.yml pull spring-boot-app
      
            # 전체 재시작 (Redis는 변경 없으면 그대로 유지됨)
            docker compose -f docker-compose.yml up -d
