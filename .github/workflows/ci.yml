name: ci.yml
on:
  pull_request:
    branches: ["develop", "main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Grant permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy FCM file for test
        run: |
          mkdir -p src/main/resources/firebase
          echo '{"type": "service_account", "project_id": "test"}' > src/main/resources/firebase/test.json

      - name: Run tests
        env:
          FCM_KEY_PATH: firebase/test.json
        run: ./gradlew test --stacktrace --no-daemon