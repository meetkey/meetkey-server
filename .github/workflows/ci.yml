name: ci.yml
on:
  pull_request:
    branches: ["develop", "main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis-chat:
        image: redis:7-alpine
        ports:
          - 6379:6379
      redis-auth:
        image: redis:7-alpine
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Grant permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --stacktrace --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATA_REDIS_CHAT_HOST: localhost
          SPRING_DATA_REDIS_CHAT_PORT: 6379
          SPRING_DATA_REDIS_AUTH_HOST: localhost
          SPRING_DATA_REDIS_AUTH_PORT: 6380